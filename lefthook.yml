# Lefthook config: https://lefthook.dev/configuration/
# Runs locally on commit and push. The CI `quality` workflow enforces the same gates remotely.

pre-commit:
  parallel: true
  jobs:
    - name: secrets
      # Requires `gitleaks` on PATH. Install with: brew install gitleaks
      # (https://github.com/gitleaks/gitleaks). If missing, the hook is a no-op;
      # the CI `reusable-secrets` job still catches secrets remotely.
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --no-banner
        else
          echo "⚠️  gitleaks not installed; skipping local secret scan (CI still scans)."
        fi
    - name: lint
      glob: '*.{ts,tsx,astro,js,mjs,cjs}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: format
      glob: '*.{ts,tsx,astro,js,mjs,cjs,json,md,mdx,css,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: check
      run: pnpm run check
    - name: lint
      run: pnpm run lint
    - name: format
      run: pnpm run format
