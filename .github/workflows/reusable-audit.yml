name: Reusable / Audit

on:
  workflow_call:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        # NB: prod gate at `high`: sharp is now >= 0.35 (libvips CVE fixed),
        # astro >= 7.2.8 (RCE fixed), and shadcn moved to devDeps. Moderate
        # stays out — postcss-selector-parser is pinned by
        # @tailwindcss/typography upstream.
        run: pnpm audit --prod --audit-level=high

      - name: Audit dev dependencies (warning only)
        continue-on-error: true
        run: pnpm audit --audit-level=moderate
